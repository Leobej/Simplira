services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: simplira
      POSTGRES_USER: simplira
      POSTGRES_PASSWORD: simplira
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@simplira.com
      PGADMIN_DEFAULT_PASSWORD: admin

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    environment:
      RABBITMQ_DEFAULT_USER: simplira
      RABBITMQ_DEFAULT_PASS: simplira
    command: >
      bash -c "rabbitmq-plugins enable rabbitmq_stomp &&
               rabbitmq-server"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Local stand-in for S3/R2 (§27), for attachments. Accepts any credentials. The store root must be
  # /s3mockroot for a named volume to be writable by the image's non-root user (S3Mock README).
  s3mock:
    image: adobe/s3mock:5.2.3
    ports:
      - "9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: simplira-attachments
    volumes:
      - s3mock_data:/s3mockroot

  # Catches every email the app sends in development (§25): SMTP on 1025, inbox at
  # http://localhost:8025. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  rabbitmq_data:
  s3mock_data: