name: CI

# Every push to master and every pull request runs the whole suite. GitHub's Ubuntu runners have
# Docker, so the Testcontainers suites (Postgres, S3Mock) run exactly as they do locally.
on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify = compile, unit and integration tests, package. The test profile carries its own
      # JWT secret, so no repository secrets are needed.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
