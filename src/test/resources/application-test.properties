# Testcontainers supplies the datasource; only the signing key has to be filled in.
simplira.jwt.secret=test-only-secret-min-32-bytes-long-padding!!

# Tests send queued email by calling EmailOutboxDispatcher themselves; a poller would race them.
simplira.email.outbox.polling=false

# Most suites are about other things and would otherwise verify every account they create.
# EmailVerificationFlowTest switches it back on.
simplira.auth.require-verified-email=false
