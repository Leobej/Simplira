# Local development only. Run with SPRING_PROFILES_ACTIVE=dev (or -Dspring.profiles.active=dev).
simplira.jwt.secret=dev-only-secret-change-me-min-32-bytes-long!!
# Local development is plain HTTP, so a Secure cookie would never be sent back.
simplira.security.refresh-cookie-secure=false

# Attachments go to the S3Mock in docker/docker-compose.yml. It accepts any keys; the bucket is
# created on startup if missing.
simplira.storage.endpoint=http://localhost:9090
simplira.storage.region=us-east-1
simplira.storage.access-key=dev
simplira.storage.secret-key=dev
simplira.storage.path-style=true
simplira.storage.create-bucket-if-missing=true
