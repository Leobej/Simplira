spring.application.name=Simplira

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/simplira}
spring.datasource.username=${DB_USERNAME:simplira}
spring.datasource.password=${DB_PASSWORD:simplira}

# Flyway owns the schema; Hibernate only checks the mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:simplira}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:simplira}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Deliberately no fallback: an app that boots without JWT_SECRET would ship a known signing key.
# Local runs pick one up from application-dev.properties via the 'dev' profile.
simplira.jwt.secret=${JWT_SECRET}
simplira.jwt.access-token-expiry=900
simplira.jwt.refresh-token-expiry=2592000
simplira.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}

# Where invitation and reset links point - the frontend, not this API.
simplira.app.base-url=${APP_BASE_URL:http://localhost:5173}
simplira.invitations.expiry=604800

# §3: notifications are temporary; the nightly job in ScheduledJobs purges them after this.
simplira.notifications.expiry-days=90

# Notification emails queue in email_outbox; this is how often the poller sends what is due.
simplira.email.outbox.poll-interval=PT10S

# §6. How long an emailed verification link works, and whether creating or joining a workspace
# needs a verified address. Leave the gate on outside tests.
simplira.auth.email-verification.expiry=86400
simplira.auth.require-verified-email=true

# §27. Any S3-compatible store: leave the endpoint blank for AWS S3 itself, set it for Cloudflare R2
# or a local S3Mock (the dev profile does). Blank keys fall back to the SDK's credential chain.
simplira.storage.bucket=${S3_BUCKET:simplira-attachments}
simplira.storage.region=${S3_REGION:eu-central-1}
simplira.storage.endpoint=${S3_ENDPOINT:}
simplira.storage.access-key=${S3_ACCESS_KEY:}
simplira.storage.secret-key=${S3_SECRET_KEY:}
simplira.storage.path-style=${S3_PATH_STYLE:false}
simplira.storage.create-bucket-if-missing=false

# §25: 10 MB per image. The request allows a little more for the multipart framing around it.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
