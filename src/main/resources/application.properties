spring.application.name=Simplira
spring.datasource.url=jdbc:postgresql://localhost:5432/simplira
spring.datasource.username=simplira
spring.datasource.password=simplira
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
simplira.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-min-32-bytes-long!!}
simplira.jwt.access-token-expiry=900